<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Certified Security – Specialty (SCS-C03) — Exame de prática</title>
<style>
:root{
  --ink:#232f3e;
  --ink-deep:#16212f;
  --orange:#ff9900;
  --blue:#146eb4;
  --blue-tint:#f1f8fe;
  --green:#1d8102;
  --green-tint:#f2f8f0;
  --red:#d13212;
  --red-tint:#fdf3f1;
  --line:#d5dbdb;
  --line-soft:#eaeded;
  --bg:#f2f3f3;
  --surface:#ffffff;
  --text:#16191f;
  --muted:#5f6b7a;
  --sans:"Amazon Ember","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible,.opt:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}

/* ---------- app chrome ---------- */
.topbar{
  background:var(--ink);
  color:#fff;
  border-bottom:3px solid var(--orange);
  padding:10px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand .eyebrow{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c8cdd4;font-weight:700;
}
.brand .name{font-size:15px;font-weight:700;letter-spacing:.01em}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  background:#31435a;border:1px solid #46596f;border-radius:2px;
  padding:5px 10px;font-size:12px;letter-spacing:.02em;white-space:nowrap;
}
.chip b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.ghost{
  background:transparent;border:1px solid #6c7d92;color:#fff;border-radius:2px;
  padding:5px 11px;font-size:12px;
}
.ghost:hover{background:#31435a}

.progress{height:4px;background:#e1e4e8}
.progress span{display:block;height:100%;background:var(--orange);width:0;transition:width .25s ease}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 120px}

/* ---------- start screen ---------- */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:28px}
.intro h1{font-size:26px;line-height:1.25;margin:6px 0 4px;letter-spacing:-.01em}
.intro .sub{color:var(--muted);margin:0 0 22px}
.rule{height:1px;background:var(--line-soft);margin:22px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.fact{background:var(--surface);padding:14px 16px}
.fact dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.fact dd{margin:0;font-size:17px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:20px;color:#3d4855}
.rules li{margin-bottom:7px}
.toggles{display:flex;flex-direction:column;gap:10px;margin:20px 0 24px}
.toggle{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.toggle input{margin:3px 0 0;accent-color:var(--blue);width:16px;height:16px}
.toggle span small{display:block;color:var(--muted)}

.primary{
  background:var(--orange);border:1px solid #e88b00;color:#16191f;font-weight:700;
  border-radius:2px;padding:11px 22px;
}
.primary:hover{background:#ffad33}
.primary:disabled{background:#e9ebed;border-color:var(--line);color:#9aa4b0;cursor:not-allowed}
.secondary{
  background:var(--surface);border:1px solid #59626e;color:var(--ink);font-weight:700;
  border-radius:2px;padding:11px 18px;
}
.secondary:hover{background:#f5f7f8}
.secondary:disabled{border-color:var(--line);color:#9aa4b0;cursor:not-allowed;background:var(--surface)}

/* ---------- question ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px}
.card-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--line-soft);
}
.qnum{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.tag{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  border:1px solid var(--line);border-radius:2px;padding:3px 8px;color:#3d4855;background:#fafbfc;
}
.flagbtn{
  margin-left:auto;background:none;border:1px solid var(--line);border-radius:2px;
  padding:4px 10px;font-size:12px;color:var(--muted);
}
.flagbtn[aria-pressed="true"]{background:#fff8ec;border-color:var(--orange);color:#8a5a00;font-weight:700}
.card-body{padding:20px}
.stem{margin:0 0 4px;white-space:pre-wrap}
.hint{color:var(--muted);font-size:13px;margin:14px 0 0}
pre.code{
  background:#f7f8f9;border:1px solid var(--line-soft);border-left:3px solid var(--ink);
  border-radius:2px;padding:12px 14px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.5;margin:14px 0 0;
}

.opts{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-left:3px solid var(--line);border-radius:2px;
  padding:12px 14px;background:var(--surface);cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.opt:hover{background:#fafbfc}
.opt input{margin:2px 0 0;accent-color:var(--blue);width:16px;height:16px;flex:none}
.opt .letter{font-family:var(--mono);font-weight:700;flex:none;color:var(--muted);min-width:14px}
.opt .txt{flex:1}
.opt.sel{border-color:var(--blue);border-left-color:var(--blue);background:var(--blue-tint)}
.opt pre.code{margin:8px 0 0;background:#fff}
.locked .opt{cursor:default}
.opt.ok{border-color:var(--green);border-left-color:var(--green);background:var(--green-tint)}
.opt.bad{border-color:var(--red);border-left-color:var(--red);background:var(--red-tint)}
.mark{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:none;align-self:center}
.mark.ok{color:var(--green)}
.mark.bad{color:var(--red)}

/* ordering + matching */
.pairs{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.pair{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:2px;padding:12px 14px;background:var(--surface)}
.pair.ok{border-color:var(--green);border-left-color:var(--green);background:var(--green-tint)}
.pair.bad{border-color:var(--red);border-left-color:var(--red);background:var(--red-tint)}
.pair .plabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.pair .ptext{margin-bottom:10px}
.pair select{
  width:100%;padding:9px 10px;border:1px solid #7d8998;border-radius:2px;background:var(--surface);
  font-family:inherit;font-size:14px;color:var(--text);
}
.pair select:disabled{background:#f7f8f9;color:#3d4855}
.answerline{margin-top:8px;font-size:13px;color:var(--green);font-weight:700}
.answerline.bad{color:var(--red)}

/* verdict */
.verdict{
  margin-top:18px;border:1px solid;border-radius:2px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;font-weight:700;
}
.verdict.ok{border-color:var(--green);background:var(--green-tint);color:#155c02}
.verdict.bad{border-color:var(--red);background:var(--red-tint);color:#9c2610}
.verdict .badge{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:2px;padding:2px 7px;
}

/* ---------- action bar ---------- */
.actions{
  position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--line);padding:12px 18px;z-index:20;
}
.actions-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.counter{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.counter b{color:var(--text)}

/* ---------- navigator ---------- */
.nav-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:2px;margin-bottom:16px;padding:16px 18px;
}
.nav-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
.nav-legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--line);margin-right:5px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gcell{
  border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:7px 0;
  font-family:var(--mono);font-size:12px;font-weight:700;color:#3d4855;position:relative;
}
.gcell.ok{border-color:var(--green);background:var(--green-tint);color:#155c02}
.gcell.bad{border-color:var(--red);background:var(--red-tint);color:#9c2610}
.gcell.here{outline:2px solid var(--ink);outline-offset:0}
.gcell.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;background:var(--orange);border-radius:50%}

/* ---------- results ---------- */
.score{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:28px}
.score h2{margin:0 0 2px;font-size:24px;letter-spacing:-.01em}
.bigscore{font-family:var(--mono);font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em;margin:18px 0 6px}
.bar{height:10px;background:var(--line-soft);border-radius:2px;overflow:hidden;position:relative;margin:14px 0 6px}
.bar span{display:block;height:100%;background:var(--green)}
.bar.fail span{background:var(--red)}
.bar em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);left:75%}
.barlabel{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:22px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
td.st-ok{color:var(--green);font-weight:700}
td.st-bad{color:var(--red);font-weight:700}
td.st-none{color:var(--muted)}
.linkish{background:none;border:none;color:var(--blue);text-decoration:underline;padding:0;font-size:13px}

@media (max-width:640px){
  .wrap{padding:14px 12px 130px}
  .intro,.score{padding:20px 16px}
  .card-body{padding:16px}
  .bigscore{font-size:44px}
  .brand .name{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="eyebrow">AWS Certification · Exame de prática</span>
    <span class="name">AWS Certified Security – Specialty (SCS-C03)</span>
  </div>
  <div class="meta" id="meta" hidden>
    <span class="chip">Tempo restante <b id="clock">170:00</b></span>
    <span class="chip">Questão <b id="pos">1/85</b></span>
    <button class="ghost" id="btnNav" aria-expanded="false">Revisar questões</button>
    <button class="ghost" id="btnEnd">Finalizar</button>
  </div>
</header>
<div class="progress"><span id="pbar"></span></div>

<main class="wrap" id="root"></main>

<div class="actions" id="bar" hidden>
  <div class="actions-in">
    <span class="counter" id="counter"></span>
    <button class="secondary" id="btnPrev">Anterior</button>
    <button class="primary" id="btnConfirm">Confirmar resposta</button>
    <button class="secondary" id="btnNext">Próxima</button>
  </div>
</div>

<script>
const QUESTIONS = [
{
  type:"single",
  stem:"Um engenheiro de segurança está solucionando problemas em uma função AWS Lambda chamada MyLambdaFunction. A função está encontrando um erro ao tentar ler objetos em um bucket do Amazon S3 chamado DOC-EXAMPLE-BUCKET. O bucket do S3 possui a seguinte política:",
  code:`{
    "Effect": "Allow",
    "Principal": {
        "Service": "lambda.amazonaws.com"
    },
    "Action": "s3:GetObject",
    "Resource": "arn:aws:s3:::DOC-EXAMPLE-BUCKET",
    "Condition": {
        "ArnLike": {
            "aws:SourceArn": "arn:aws:lambda:::function:MyLambdaFunction"
        }
    }
}`,
  ask:"Qual alteração o engenheiro de segurança deve fazer na política para garantir que a função Lambda possa ler os objetos do bucket?",
  options:[
    {id:"A",text:'Remova o elemento Condition. Altere o elemento Principal para: { "AWS": "arn:aws:lambda:::function:MyLambdaFunction" }'},
    {id:"B",text:'Altere o elemento Action para: [ "s3:GetObject*", "s3:GetBucket*" ]'},
    {id:"C",text:'Altere o elemento Resource para "arn:aws:s3:::DOC-EXAMPLE-BUCKET/*".'},
    {id:"D",text:'Altere o elemento Resource para "arn:aws:lambda:::function:MyLambdaFunction". Altere o elemento Principal para: { "Service": "s3.amazonaws.com" }'}
  ],
  answer:["C"]
},
{
  type:"order",
  stem:"Uma empresa está desenvolvendo um aplicativo web que precisa autenticar usuários externos em vários microsserviços hospedados no Amazon Elastic Container Service (Amazon ECS). A solução deve usar credenciais temporárias e minimizar a sobrecarga de gerenciamento necessária para manter bancos de dados de usuários.",
  ask:"Selecione e ordene as etapas corretas da lista a seguir para implementar uma estratégia de autenticação segura que atenda a esses requisitos. Selecione cada etapa uma vez ou nenhuma.",
  pool:[
    "Configure os grupos de usuários do Amazon Cognito para autenticação de usuários.",
    "Configure uma função do IAM para cada microsserviço. Conceda a cada função as permissões apropriadas.",
    "Implemente uma API HTTP do Amazon API Gateway com autorizadores do AWS Lambda para validar tokens antes de encaminhar as solicitações para os microsserviços.",
    "Crie uma tabela do Amazon DynamoDB para armazenar as credenciais de usuário de cada microsserviço.",
    "Crie um cliente de aplicativo do Amazon Cognito para interagir com o aplicativo web.",
    "Configure o AWS IAM Identity Center para conceder acesso aos usuários aos microsserviços."
  ],
  answer:[0,4,2]
},
{
  type:"single",
  stem:"Um administrador de conta da AWS criou um grupo do IAM e aplicou a seguinte política gerenciada para exigir que cada usuário individual se autentique usando autenticação multifator:",
  code:`{
    "Version": "2012-10-17",
    "Statement": [
        {
            "Effect": "Allow",
            "Action": "ec2:*",
            "Resource": "*"
        },
        {
            "Sid": "BlockAnyAccessUnlessSignedInWithMFA",
            "Effect": "Deny",
            "Action": "ec2:*",
            "Resource": "*",
            "Condition": {
                "BoolIfExists": {
                    "aws:MultiFactorAuthPresent": false
                }
            }
        }
    ]
}`,
  ask:"Após implementar a política, o administrador recebe relatos de que os usuários não conseguem executar comandos do Amazon EC2 usando a AWS CLI. O que o administrador deve fazer para resolver esse problema, mantendo a exigência de autenticação multifator?",
  options:[
    {id:"A",text:"Altere o valor de aws:MultiFactorAuthPresent para true."},
    {id:"B",text:"Instrua os usuários a executar o comando CLI aws sts get-session-token e a passar os parâmetros --serial-number e --token-code da autenticação multifator. Use esses valores resultantes para fazer chamadas de API/CLI."},
    {id:"C",text:"Implemente o acesso federado à API/CLI usando SAML 2.0 e, em seguida, configure o provedor de identidade para impor a autenticação multifator."},
    {id:"D",text:"Crie uma função e imponha a autenticação multifator na política de confiança da função. Instrua os usuários a executar o comando CLI sts assume-role e passar os parâmetros --serial-number e --token-code. Armazene os valores resultantes em variáveis de ambiente. Adicione sts:AssumeRole à propriedade NotAction na política."}
  ],
  answer:["B"]
},
{
  type:"single",
  stem:"Uma empresa utiliza o AWS Organizations com o SCP padrão. A empresa precisa restringir o uso da AWS para todas as contas da AWS que estejam em uma Unidade Organizacional (UO) específica. Com exceção de alguns serviços globais desejados, o uso da AWS deve ocorrer somente na região eu-west-1 para todas as contas na UO. Um engenheiro de segurança deve criar um SCP que aplique a restrição às contas existentes e a quaisquer novas contas na UO.",
  ask:"Qual SCP atenderá a esses requisitos?",
  options:[
    {id:"A",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": [{
        "Sid": "DenyNonDefaultRegions",
        "Effect": "Deny",
        "NotAction": [ <Desired Global Services> ],
        "Resource": "*",
        "Condition": {
            "StringEquals": {
                "aws:RequestedRegion": [ "eu-west-1" ]
            }
        }
    }]
}`},
    {id:"B",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": [{
        "Sid": "DenyNonDefaultRegions",
        "Effect": "Allow",
        "Action": [ <Desired Global Services> ],
        "Resource": "*",
        "Condition": {
            "StringEquals": {
                "aws:RequestedRegion": [ "eu-west-1" ]
            }
        }
    }]
}`},
    {id:"C",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": [{
        "Sid": "DenyNonDefaultRegions",
        "Effect": "Deny",
        "NotAction": [ <Desired Global Services> ],
        "Resource": "*",
        "Condition": {
            "StringNotEquals": {
                "aws:RequestedRegion": [ "eu-west-1" ]
            }
        }
    }]
}`},
    {id:"D",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": [{
        "Sid": "DenyNonDefaultRegions",
        "Effect": "Allow",
        "NotAction": [ <Desired Global Services> ],
        "Resource": "*",
        "Condition": {
            "StringNotEquals": {
                "aws:RequestedRegion": [ "eu-west-1" ]
            }
        }
    }]
}`}
  ],
  answer:["C"]
},
{
  type:"order",
  stem:"Um engenheiro de segurança precisa implementar o AWS IAM Identity Center com um provedor de identidade (IdP) externo.",
  ask:"Selecione e ordene as etapas corretas da lista a seguir para atender a esse requisito. Selecione cada etapa uma vez ou nenhuma.",
  pool:[
    "Configure o IdP externo como a fonte de identidade no IAM Identity Center.",
    "Crie uma função do IAM com uma política de confiança que especifique o endpoint da API do IdP.",
    "Habilite o provisionamento automático nas configurações do IAM Identity Center.",
    "Habilite o provisionamento automático no IdP externo.",
    "Obtenha os metadados SAML do IAM Identity Center.",
    "Obtenha os metadados SAML do IdP externo."
  ],
  answer:[5,0,2]
},
{
  type:"single",
  stem:"Qual o efeito da seguinte política de chave do AWS Key Management Service (AWS KMS) associada a uma chave gerenciada pelo cliente?",
  code:`{
  "Effect": "Allow",
  "Principal": {
    "AWS": "arn:aws:iam::111122223333:role/ExampleRole"
  },
  "Action": [
    "kms:Encrypt",
    "kms:Decrypt",
    "kms:GenerateDataKey*",
    "kms:CreateGrant",
    "kms:ListGrants"
  ],
  "Resource": "*",
  "Condition": {
    "StringEquals": {
      "kms:ViaService": [
        "workmail.us-west-2.amazonaws.com",
        "ses.us-west-2.amazonaws.com"
      ]
    }
  }
}`,
  options:[
    {id:"A",text:"O Amazon WorkMail e o Amazon Simple Email Service (Amazon SES) delegaram permissões de criptografia e descriptografia do KMS para a entidade ExampleRole na conta 111122223333."},
    {id:"B",text:"A entidade ExampleRole pode criptografar e descriptografar de forma transparente as trocas de e-mail especificamente entre ExampleRole e a AWS."},
    {id:"C",text:"A chave gerenciada pelo cliente pode ser usada para criptografar e descriptografar somente quando a entidade principal for ExampleRole e quando a solicitação vier do Amazon WorkMail ou do Amazon Simple Email Service (Amazon SES) na região da AWS especificada."},
    {id:"D",text:"A política de chave permite que o Amazon WorkMail ou o Amazon Simple Email Service (Amazon SES) criptografem ou descriptografem em nome da ExampleRole qualquer chave gerenciada pelo cliente na conta."}
  ],
  answer:["C"]
},
{
  type:"single",
  stem:"Uma empresa deseja negar o acesso de um usuário federado específico, chamado Bob, a um bucket do Amazon S3 chamado DOC-EXAMPLE-BUCKET. A empresa deseja atender a esse requisito usando uma política de bucket. A empresa também precisa garantir que essa política de bucket afete apenas as permissões de Bob no S3. Quaisquer outras permissões que Bob possua devem permanecer intactas.",
  ask:"Qual política a empresa deve usar para atender a esses requisitos?",
  options:[
    {id:"A",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": {
        "Principal": {"AWS": "arn:aws:sts::account-id:federated-user/Bob"},
        "Effect": "Allow",
        "Action": "s3:*",
        "Resource": "arn:aws:s3:::DOC-EXAMPLE-BUCKET"
    }
}`},
    {id:"B",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": {
        "Principal": {"AWS": "arn:aws:sts::account-id:federated-user/Bob"},
        "Effect": "Deny",
        "Action": "s3:*",
        "Resource": "arn:aws:s3:::DOC-EXAMPLE-BUCKET"
    }
}`},
    {id:"C",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": {
        "Principal": {"AWS": "arn:aws:iam::account-id:user/Bob"},
        "Effect": "Deny",
        "Action": "s3:*",
        "Resource": "arn:aws:s3:::DOC-EXAMPLE-BUCKET"
    }
}`},
    {id:"D",text:"",code:`{
    "Version": "2012-10-17",
    "Statement": {
        "Principal": {"AWS": "arn:aws:sts::account-id:assumed-role/Bob/role-session-name"},

/* ============================ estado ============================ */
const LETTERS = ["A","B","C","D","E","F","G"];
const TOTAL_SECONDS = 170 * 60;
const TYPE_LABEL = {
  single:"Múltipla escolha",
  multi:"Resposta múltipla",
  order:"Ordenação",
  match:"Correspondência"
};

let order = [];
let state = [];
let cur = 0;
let started = false;
let finished = false;
let showNav = false;
let left = TOTAL_SECONDS;
let ticker = null;

const el = id => document.getElementById(id);
const root = el("root");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function q(){ return QUESTIONS[order[cur]]; }
function s(){ return state[order[cur]]; }

function build(shuffleQ, shuffleO){
  order = QUESTIONS.map((_,i)=>i);
  if(shuffleQ) shuffle(order);
  state = QUESTIONS.map(qq=>{
    const st = {locked:false, correct:null, flagged:false, picked:[], slots:[]};
    if(qq.type==="single" || qq.type==="multi"){
      st.optOrder = qq.options.map((_,i)=>i);
      if(shuffleO) shuffle(st.optOrder);
    }
    if(qq.type==="order") st.slots = new Array(qq.answer.length).fill("");
    if(qq.type==="match") st.slots = new Array(qq.prompts.length).fill("");
    return st;
  });
  cur = 0; started = true; finished = false; left = TOTAL_SECONDS;
  el("meta").hidden = false;
  el("bar").hidden = false;
  clearInterval(ticker);
  ticker = setInterval(tick, 1000);
  render();
}

function tick(){
  if(!started || finished) return;
  if(left > 0) left--;
  paintClock();
}
function paintClock(){
  const m = Math.floor(left/60), sec = left%60;
  const c = el("clock");
  c.textContent = String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  c.style.color = left <= 300 ? "#ffb3a7" : "#fff";
}

/* ============================ correção ============================ */
function ready(qq, st){
  if(qq.type==="single") return st.picked.length===1;
  if(qq.type==="multi")  return st.picked.length===qq.pick;
  return st.slots.every(v=>v!=="");
}
function grade(qq, st){
  if(qq.type==="single" || qq.type==="multi"){
    const chosen = st.picked.map(i=>qq.options[i].id).sort().join(",");
    return chosen === [...qq.answer].sort().join(",");
  }
  if(qq.type==="order") return st.slots.every((v,i)=>Number(v)===qq.answer[i]);
  return st.slots.every((v,i)=>Number(v)===qq.prompts[i].a);
}
function answeredCount(){ return state.filter(x=>x.locked).length; }
function correctCount(){ return state.filter(x=>x.correct===true).length; }

/* ============================ telas ============================ */
function renderIntro(){
  el("meta").hidden = true;
  el("bar").hidden = true;
  el("pbar").style.width = "0%";
  root.innerHTML = `
  <section class="intro">
    <span style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700">Exame de prática · Português (Brasil)</span>
    <h1>AWS Certified Security – Specialty</h1>
    <p class="sub">Código do exame SCS-C03 · Banco de ${QUESTIONS.length} questões</p>

    <dl class="facts">
      <div class="fact"><dt>Questões</dt><dd>${QUESTIONS.length}</dd></div>
      <div class="fact"><dt>Duração</dt><dd>170 min</dd></div>
      <div class="fact"><dt>Referência de aprovação</dt><dd>75%</dd></div>
      <div class="fact"><dt>Formatos</dt><dd>4</dd></div>
    </dl>

    <div class="rule"></div>

    <h2 style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px">Como funciona</h2>
    <ul class="rules">
      <li>Cada questão é respondida individualmente. O gabarito permanece oculto até você usar <b>Confirmar resposta</b>.</li>
      <li>Depois de confirmar, a questão é travada: o resultado aparece e a resposta correta é destacada.</li>
      <li>Questões de resposta múltipla indicam quantas alternativas selecionar. Ordenação e correspondência usam listas suspensas.</li>
      <li>Use <b>Marcar para revisão</b> para voltar depois e <b>Revisar questões</b> para navegar pelo exame.</li>
      <li>O cronômetro é apenas uma referência de ritmo. Ele não encerra o exame.</li>
    </ul>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="shQ"><span>Embaralhar as questões<small>A ordem muda a cada tentativa.</small></span></label>
      <label class="toggle"><input type="checkbox" id="shO"><span>Embaralhar as alternativas<small>Vale para múltipla escolha e resposta múltipla.</small></span></label>
    </div>

    <button class="primary" id="btnStart">Iniciar exame</button>
  </section>`;
  el("btnStart").onclick = () => build(el("shQ").checked, el("shO").checked);
}

function navPanel(){
  if(!showNav) return "";
  const cells = order.map((qi,pos)=>{
    const st = state[qi];
    let cls = "gcell";
    if(st.correct===true) cls += " ok";
    if(st.correct===false) cls += " bad";
    if(st.flagged) cls += " flag";
    if(pos===cur) cls += " here";
    return `<button class="${cls}" data-go="${pos}">${pos+1}</button>`;
  }).join("");
  return `
  <section class="nav-panel">
    <div class="nav-legend">
      <span><i style="background:#fff"></i>Não respondida</span>
      <span><i style="background:var(--green-tint);border-color:var(--green)"></i>Correta</span>
      <span><i style="background:var(--red-tint);border-color:var(--red)"></i>Incorreta</span>
      <span><i style="background:var(--orange);border-color:var(--orange);border-radius:50%"></i>Marcada para revisão</span>
    </div>
    <div class="grid">${cells}</div>
  </section>`;
}

function optionsHTML(qq, st){
  const input = qq.type==="single" ? "radio" : "checkbox";
  return `<ul class="opts">` + st.optOrder.map((oi,pos)=>{
    const o = qq.options[oi];
    const sel = st.picked.includes(oi);
    const isRight = qq.answer.includes(o.id);
    let cls = "opt";
    let mark = "";
    if(st.locked){
      if(isRight){ cls += " ok"; mark = `<span class="mark ok">Correta</span>`; }
      else if(sel){ cls += " bad"; mark = `<span class="mark bad">Sua escolha</span>`; }
    } else if(sel){ cls += " sel"; }
    return `<li><label class="${cls}">
      <input type="${input}" name="opt" value="${oi}" ${sel?"checked":""} ${st.locked?"disabled":""}>
      <span class="letter">${LETTERS[pos]}</span>
      <span class="txt">${o.text?esc(o.text):""}${o.code?`<pre class="code">${esc(o.code)}</pre>`:""}</span>
      ${mark}
    </label></li>`;
  }).join("") + `</ul>`;
}

function slotsHTML(qq, st){
  const isOrder = qq.type==="order";
  const pool = isOrder ? qq.pool : qq.pool;
  const rows = st.slots.map((val,i)=>{
    const right = isOrder ? qq.answer[i] : qq.prompts[i].a;
    let cls = "pair";
    let line = "";
    if(st.locked){
      const ok = Number(val)===right;
      cls += ok ? " ok" : " bad";
      line = ok
        ? `<div class="answerline">Correta</div>`
        : `<div class="answerline bad">Correta: ${esc(pool[right])}</div>`;
    }
    const label = isOrder ? `Etapa ${i+1}` : `Requisito ${i+1}`;
    const head = isOrder ? "" : `<div class="ptext">${esc(qq.prompts[i].t)}</div>`;
    const opts = [`<option value="">Selecionar…</option>`].concat(
      pool.map((p,pi)=>`<option value="${pi}" ${String(val)===String(pi)?"selected":""}>${esc(p)}</option>`)
    ).join("");
    return `<div class="${cls}">
      <div class="plabel">${label}</div>
      ${head}
      <select data-slot="${i}" ${st.locked?"disabled":""}>${opts}</select>
      ${line}
    </div>`;
  }).join("");
  return `<div class="pairs">${rows}</div>`;
}

function verdictHTML(st){
  if(!st.locked) return "";
  return st.correct
    ? `<div class="verdict ok"><span class="badge">Correto</span> Resposta correta.</div>`
    : `<div class="verdict bad"><span class="badge">Incorreto</span> Resposta incorreta.</div>`;
}

function renderQuestion(){
  const qq = q(), st = s();
  el("pos").textContent = (cur+1)+"/"+order.length;
  el("pbar").style.width = ((cur+1)/order.length*100)+"%";
  el("counter").innerHTML = `Respondidas <b>${answeredCount()}</b> de ${order.length} · Corretas <b>${correctCount()}</b>`;

  root.innerHTML = navPanel() + `
  <section class="card ${st.locked?"locked":""}">
    <div class="card-head">
      <span class="qnum">Questão ${cur+1} de ${order.length}</span>
      <span class="tag">${TYPE_LABEL[qq.type]}</span>
      <button class="flagbtn" id="btnFlag" aria-pressed="${st.flagged}">${st.flagged?"Marcada para revisão":"Marcar para revisão"}</button>
    </div>
    <div class="card-body">
      <p class="stem">${esc(qq.stem)}</p>
      ${qq.code?`<pre class="code">${esc(qq.code)}</pre>`:""}
      ${qq.ask?`<p class="stem" style="margin-top:14px"><b>${esc(qq.ask)}</b></p>`:""}
      ${qq.type==="multi"?`<p class="hint">Selecione ${qq.pick} alternativas.</p>`:""}
      ${(qq.type==="single"||qq.type==="multi") ? optionsHTML(qq,st) : slotsHTML(qq,st)}
      ${verdictHTML(st)}
    </div>
  </section>`;

  // eventos das alternativas
  root.querySelectorAll('input[name="opt"]').forEach(inp=>{
    inp.onchange = () => {
      const v = Number(inp.value);
      if(qq.type==="single"){ st.picked = [v]; }
      else {
        if(inp.checked){
          if(st.picked.length >= qq.pick){ inp.checked = false; return; }
          st.picked.push(v);
        } else {
          st.picked = st.picked.filter(x=>x!==v);
        }
      }
      renderQuestion();
    };
  });
  root.querySelectorAll("select[data-slot]").forEach(sl=>{
    sl.onchange = () => { st.slots[Number(sl.dataset.slot)] = sl.value; syncButtons(); };
  });
  root.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick = () => { cur = Number(b.dataset.go); renderQuestion(); };
  });
  el("btnFlag").onclick = () => { st.flagged = !st.flagged; renderQuestion(); };

  syncButtons();
}

function syncButtons(){
  const qq = q(), st = s();
  const cf = el("btnConfirm");
  el("btnPrev").disabled = cur === 0;
  el("btnNext").disabled = cur >= order.length-1;
  if(st.locked){
    cf.textContent = cur >= order.length-1 ? "Ver resultado" : "Próxima questão";
    cf.disabled = false;
  } else {
    cf.textContent = "Confirmar resposta";
    cf.disabled = !ready(qq, st);
  }
}

function confirmAnswer(){
  const qq = q(), st = s();
  if(st.locked){
    if(cur >= order.length-1) renderResults();
    else { cur++; renderQuestion(); }
    return;
  }
  if(!ready(qq, st)) return;
  st.locked = true;
  st.correct = grade(qq, st);
  renderQuestion();
}

function renderResults(){
  finished = true;
  clearInterval(ticker);
  el("bar").hidden = true;
  const done = answeredCount(), right = correctCount();
  const pct = done ? Math.round(right/done*100) : 0;
  const pass = pct >= 75;
  const rows = order.map((qi,pos)=>{
    const st = state[qi];
    const stat = st.correct===true ? `<td class="st-ok">Correta</td>`
      : st.correct===false ? `<td class="st-bad">Incorreta</td>`
      : `<td class="st-none">Não respondida</td>`;
    return `<tr>
      <td style="font-family:var(--mono)">${pos+1}</td>
      <td>${TYPE_LABEL[QUESTIONS[qi].type]}</td>
      ${stat}
      <td>${st.flagged?"Marcada":""}</td>
      <td><button class="linkish" data-go="${pos}">Abrir</button></td>
    </tr>`;
  }).join("");

  root.innerHTML = `
  <section class="score">
    <span style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700">Resultado do exame de prática</span>
    <h2>AWS Certified Security – Specialty (SCS-C03)</h2>
    <div class="bigscore" style="color:${pass?"var(--green)":"var(--red)"}">${pct}%</div>
    <div>${right} de ${done} questões respondidas corretamente${done<order.length?` · ${order.length-done} sem resposta`:""}</div>
    <div class="bar ${pass?"":"fail"}"><span style="width:${pct}%"></span><em title="Referência de 75%"></em></div>
    <div class="barlabel">A marca vertical indica a referência de 75% usada neste simulado. ${pass?"Você ficou acima dela.":"Você ficou abaixo dela."}</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
      <button class="secondary" id="btnBack">Voltar ao exame</button>
      <button class="primary" id="btnRestart">Reiniciar simulado</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>Formato</th><th>Situação</th><th>Revisão</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;

  root.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick = () => { cur = Number(b.dataset.go); finished=false; el("bar").hidden=false; ticker=setInterval(tick,1000); renderQuestion(); };
  });
  el("btnBack").onclick = () => { finished=false; el("bar").hidden=false; ticker=setInterval(tick,1000); renderQuestion(); };
  el("btnRestart").onclick = () => {
    if(confirm("Reiniciar o simulado? Todas as respostas serão apagadas.")){
      clearInterval(ticker); started=false; renderIntro();
    }
  };
}

function render(){ started ? renderQuestion() : renderIntro(); paintClock(); }

/* ============================ controles ============================ */
el("btnConfirm").onclick = confirmAnswer;
el("btnPrev").onclick = () => { if(cur>0){cur--; renderQuestion();} };
el("btnNext").onclick = () => { if(cur<order.length-1){cur++; renderQuestion();} };
el("btnNav").onclick = () => {
  showNav = !showNav;
  el("btnNav").setAttribute("aria-expanded", String(showNav));
  el("btnNav").textContent = showNav ? "Fechar revisão" : "Revisar questões";
  renderQuestion();
  window.scrollTo({top:0});
};
el("btnEnd").onclick = () => {
  const pend = order.length - answeredCount();
  if(pend===0 || confirm(`Ainda há ${pend} questão(ões) sem resposta. Finalizar agora?`)) renderResults();
};

document.addEventListener("keydown", e=>{
  if(!started || finished) return;
  if(["SELECT","INPUT","TEXTAREA","BUTTON"].includes(e.target.tagName)) return;
  const qq = q(), st = s();
  if(e.key==="Enter"){ e.preventDefault(); confirmAnswer(); return; }
  if(e.key==="ArrowRight" && cur<order.length-1){ cur++; renderQuestion(); return; }
  if(e.key==="ArrowLeft" && cur>0){ cur--; renderQuestion(); return; }
  if(st.locked) return;
  if(qq.type!=="single" && qq.type!=="multi") return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  if(i>=0 && i<st.optOrder.length){
    const oi = st.optOrder[i];
    if(qq.type==="single") st.picked = [oi];
    else {
      if(st.picked.includes(oi)) st.picked = st.picked.filter(x=>x!==oi);
      else if(st.picked.length < qq.pick) st.picked.push(oi);
    }
    renderQuestion();
  }
});

renderIntro();
</script>
</body>
</html>
